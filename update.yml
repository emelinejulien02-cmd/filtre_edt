name: Mettre à jour l'emploi du temps filtré

on:
  schedule:
    - cron: "0 */3 * * *"   # toutes les 3 heures
  workflow_dispatch: {}       # bouton "Run workflow" manuel
  push:
    branches: [main]
    paths:
      - "config.yaml"
      - "filter_ics.py"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer le calendrier filtré
        env:
          EDT_SOURCE_URL: ${{ secrets.EDT_SOURCE_URL }}
        run: python filter_ics.py

      - name: Préparer les fichiers à publier
        run: |
          mkdir -p site
          cp docs/edt_filtre.ics site/edt_filtre.ics

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Uploader l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Déployer sur Pages
        id: deployment
        uses: actions/deploy-pages@v4
